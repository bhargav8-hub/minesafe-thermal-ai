<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
    <linearGradient id="actuatorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Grid overlay lines for technical blueprint look -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="560" x2="1200" y2="560" />
    <line x1="200" y1="0" x2="200" y2="680" />
    <line x1="400" y1="0" x2="400" y2="680" />
    <line x1="600" y1="0" x2="600" y2="680" />
    <line x1="800" y1="0" x2="800" y2="680" />
    <line x1="1000" y1="0" x2="1000" y2="680" />
  </g>

  <!-- Title & Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="1120" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="30" cy="30" r="14" fill="#0284c7" />
    <text x="30" y="35" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">AI</text>
    <text x="60" y="28" fill="#f8fafc" font-size="18" font-weight="bold" letter-spacing="0.5">MineSafe Thermal AI — End-to-End System Architecture</text>
    <text x="60" y="48" fill="#94a3b8" font-size="12">IoT-Based Predictive Thermal &amp; Hazardous Gas Management System for Underground Mining</text>
    <rect x="960" y="15" width="140" height="30" rx="15" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <circle cx="975" cy="30" r="5" fill="#34d399" filter="url(#glow)" />
    <text x="990" y="35" fill="#ecfdf5" font-size="11" font-weight="600">IoT Course Project</text>
  </g>

  <!-- LAYER 1: SENSORS (UNDERGROUND CAVE SENSING) -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="230" height="420" rx="10" fill="url(#sensorGrad)" stroke="#0284c7" stroke-width="1.5" />
    <rect x="0" y="0" width="230" height="36" rx="10" fill="#0369a1" />
    <text x="115" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">1. UNDERGROUND SENSORS</text>

    <!-- DHT22 -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="200" height="95" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="24" fill="#38bdf8" font-size="13" font-weight="bold">DHT22 Digital Sensor</text>
      <text x="12" y="44" fill="#94a3b8" font-size="11">Ambient Air Temp &amp; Humidity</text>
      <text x="12" y="62" fill="#cbd5e1" font-size="10">• Range: -40°C to +80°C (±0.5°C)</text>
      <text x="12" y="78" fill="#cbd5e1" font-size="10">• Pin: GPIO 4 (1-Wire Bus, 3.3V)</text>
      <circle cx="185" cy="22" r="6" fill="#10b981" />
    </g>

    <!-- MLX90614 IR -->
    <g transform="translate(15, 160)">
      <rect x="0" y="0" width="200" height="110" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="12" y="24" fill="#f59e0b" font-size="13" font-weight="bold">MLX90614 IR Thermal</text>
      <text x="12" y="44" fill="#94a3b8" font-size="11">Rock &amp; Drill Surface Radiation</text>
      <text x="12" y="62" fill="#cbd5e1" font-size="10">• Non-contact infrared thermopile</text>
      <text x="12" y="78" fill="#cbd5e1" font-size="10">• Spots machine friction heat early</text>
      <text x="12" y="94" fill="#cbd5e1" font-size="10">• Pin: GPIO 21 (SDA), 22 (SCL)</text>
      <circle cx="185" cy="22" r="6" fill="#f59e0b" />
    </g>

    <!-- MQ-135 Gas -->
    <g transform="translate(15, 285)">
      <rect x="0" y="0" width="200" height="115" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="12" y="24" fill="#ec4899" font-size="13" font-weight="bold">MQ-135 Gas &amp; AQI</text>
      <text x="12" y="44" fill="#94a3b8" font-size="11">Toxic Gas &amp; Air Quality</text>
      <text x="12" y="62" fill="#cbd5e1" font-size="10">• Detects CO, CO2, Smoke, NH3</text>
      <text x="12" y="78" fill="#cbd5e1" font-size="10">• Heated metal-oxide semiconductor</text>
      <text x="12" y="94" fill="#cbd5e1" font-size="10">• Pin: GPIO 34 (Analog ADC1, 5V)</text>
      <circle cx="185" cy="22" r="6" fill="#ec4899" />
    </g>
  </g>

  <!-- LAYER 2: EDGE CONTROLLER (ESP32-S3) -->
  <g transform="translate(320, 110)">
    <rect x="0" y="0" width="240" height="420" rx="10" fill="url(#edgeGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="36" rx="10" fill="#047857" />
    <text x="120" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">2. EDGE COMPUTING NODE</text>

    <!-- ESP32 Core Box -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="210" height="150" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="12" y="24" fill="#34d399" font-size="14" font-weight="bold">ESP32-S3 Microcontroller</text>
      <text x="12" y="44" fill="#94a3b8" font-size="11">Dual-Core Xtensa LX7 @ 240MHz</text>
      <line x1="12" y1="52" x2="198" y2="52" stroke="#334155" stroke-width="1" />
      <text x="12" y="70" fill="#e2e8f0" font-size="11">⚙ FreeRTOS Multitasking</text>
      <text x="12" y="88" fill="#e2e8f0" font-size="11">📊 ADC Noise Filtering (EMA)</text>
      <text x="12" y="106" fill="#e2e8f0" font-size="11">⏱ 1000ms Sampling Cycle</text>
      <text x="12" y="124" fill="#e2e8f0" font-size="11">🛡 Fail-safe Watchdog Timer</text>
      <text x="12" y="142" fill="#38bdf8" font-size="10">Wi-Fi 802.11 b/g/n &amp; BLE 5.0</text>
    </g>

    <!-- Edge Decision Engine -->
    <g transform="translate(15, 215)">
      <rect x="0" y="0" width="210" height="185" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1" />
      <text x="12" y="22" fill="#6ee7b7" font-size="12" font-weight="bold">Edge Decision Logic</text>
      <line x1="12" y1="30" x2="198" y2="30" stroke="#334155" stroke-width="1" />
      <text x="12" y="48" fill="#cbd5e1" font-size="10">1. Instant Rock Temp Derivative:</text>
      <text x="16" y="64" fill="#f59e0b" font-size="10" font-weight="600">   dT/dt = (T_now - T_prev) / Δt</text>
      <text x="12" y="82" fill="#cbd5e1" font-size="10">2. Local Safety Override:</text>
      <text x="16" y="98" fill="#ef4444" font-size="10" font-weight="600">   If Temp &gt; 38°C or Gas &gt; 350ppm</text>
      <text x="16" y="112" fill="#ef4444" font-size="10">   ➔ Immediate 100% Fan Override</text>
      <text x="12" y="130" fill="#cbd5e1" font-size="10">3. Telemetry Serialization:</text>
      <text x="16" y="146" fill="#38bdf8" font-size="10">   JSON payload over MQTT / WS</text>
      <text x="12" y="166" fill="#94a3b8" font-size="9">Operates even if Surface Wi-Fi drops</text>
    </g>
  </g>

  <!-- LAYER 3: CLOUD & PREDICTIVE AI ENGINE -->
  <g transform="translate(610, 110)">
    <rect x="0" y="0" width="270" height="420" rx="10" fill="url(#cloudGrad)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="0" y="0" width="270" height="36" rx="10" fill="#4338ca" />
    <text x="135" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">3. SURFACE CLOUD &amp; AI ENGINE</text>

    <!-- AI Core Engine -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="240" height="160" rx="6" fill="#0f172a" stroke="#a5b4fc" stroke-width="1" />
      <text x="12" y="24" fill="#c7d2fe" font-size="13" font-weight="bold">10-Min Predictive Heat Model</text>
      <text x="12" y="44" fill="#818cf8" font-size="11">Machine Learning / Trend Velocity</text>
      <line x1="12" y1="52" x2="228" y2="52" stroke="#334155" stroke-width="1" />
      <text x="12" y="70" fill="#e0e7ff" font-size="10">Formula:</text>
      <text x="16" y="86" fill="#38bdf8" font-size="11" font-family="monospace">T_pred = T_air + (v_rock × 10)</text>
      <text x="12" y="104" fill="#94a3b8" font-size="10">• Anticipates heat spike BEFORE air warms</text>
      <text x="12" y="120" fill="#94a3b8" font-size="10">• Prevents miner heat stress proactively</text>
      <text x="12" y="136" fill="#94a3b8" font-size="10">• Reduces ventilation energy waste by 35%</text>
      <text x="12" y="152" fill="#34d399" font-size="10">Output: Target Fan Speed (0% - 100%)</text>
    </g>

    <!-- Web Dashboard & Monitoring -->
    <g transform="translate(15, 225)">
      <rect x="0" y="0" width="240" height="175" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
      <text x="12" y="22" fill="#a5b4fc" font-size="12" font-weight="bold">React 19 Executive Dashboard</text>
      <line x1="12" y1="30" x2="228" y2="30" stroke="#334155" stroke-width="1" />
      <text x="12" y="48" fill="#e2e8f0" font-size="10">🎮 2D Cutaway Cave Simulation</text>
      <text x="12" y="66" fill="#e2e8f0" font-size="10">👷 4-Stage Miner Biometric Reaction</text>
      <text x="12" y="84" fill="#e2e8f0" font-size="10">🔌 Tinkercad Virtual Breadboard Bench</text>
      <text x="12" y="102" fill="#e2e8f0" font-size="10">📜 DGMS/OSHA Mining Compliance Log</text>
      <text x="12" y="120" fill="#e2e8f0" font-size="10">🚨 SOS Collapse &amp; Emergency Dispatch</text>
      <text x="12" y="138" fill="#38bdf8" font-size="10">Live WebSockets / Local Simulated Feed</text>
      <text x="12" y="156" fill="#94a3b8" font-size="9">Responsive UI (Tailwind CSS v4 + Lucide)</text>
    </g>
  </g>

  <!-- LAYER 4: ACTUATOR (FAN & RELAY) + POWER -->
  <g transform="translate(930, 110)">
    <!-- Actuator Unit -->
    <rect x="0" y="0" width="230" height="240" rx="10" fill="url(#actuatorGrad)" stroke="#f97316" stroke-width="1.5" />
    <rect x="0" y="0" width="230" height="36" rx="10" fill="#c2410c" />
    <text x="115" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">4. ACTUATOR &amp; COOLING</text>

    <!-- 5V Relay -->
    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="200" height="80" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1" />
      <text x="12" y="22" fill="#fdba74" font-size="12" font-weight="bold">5V Optocoupler Relay</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">• Pin: GPIO 18 (Active LOW/HIGH)</text>
      <text x="12" y="54" fill="#cbd5e1" font-size="10">• Isolates ESP32 from 12V high load</text>
      <text x="12" y="70" fill="#cbd5e1" font-size="10">• Switching: 10A @ 250VAC / 30VDC</text>
    </g>

    <!-- Industrial Fan -->
    <g transform="translate(15, 138)">
      <rect x="0" y="0" width="200" height="85" rx="6" fill="#1e293b" stroke="#fb923c" stroke-width="1" />
      <text x="12" y="22" fill="#ffedd5" font-size="12" font-weight="bold">12V High-CFM Vent Fan</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">• 12V DC Brushless Exhaust Motor</text>
      <text x="12" y="54" fill="#cbd5e1" font-size="10">• Eco Mode: 30% (Low power idle)</text>
      <text x="12" y="70" fill="#34d399" font-size="10">• Emergency Boost: 100% CFM Airflow</text>
    </g>

    <!-- Power & Resilience Subsystem -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="230" height="165" rx="10" fill="url(#powerGrad)" stroke="#a855f7" stroke-width="1.5" />
      <rect x="0" y="0" width="230" height="34" rx="10" fill="#7e22ce" />
      <text x="115" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">POWER &amp; RESILIENCE</text>

      <g transform="translate(15, 44)">
        <text x="0" y="16" fill="#f3e8ff" font-size="11" font-weight="bold">12V 5A Supply + LiFePO4 UPS</text>
        <text x="0" y="34" fill="#d8b4fe" font-size="10">• Dual input: Mains + 0ms Switchover</text>
        <text x="0" y="50" fill="#d8b4fe" font-size="10">• Backup battery sustains sensors &amp; fans</text>
        <text x="0" y="72" fill="#f3e8ff" font-size="11" font-weight="bold">LM2596 Buck Step-Down</text>
        <text x="0" y="90" fill="#d8b4fe" font-size="10">• Steps 12V down to clean 5.0V</text>
        <text x="0" y="106" fill="#d8b4fe" font-size="10">• Feeds ESP32-S3 Vin &amp; MQ-135 Heater</text>
      </g>
    </g>
  </g>

  <!-- DATA FLOW ARROWS -->
  <!-- 1. Sensors -> ESP32 -->
  <path d="M 270 200 L 320 200" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan)" />
  <text x="295" y="190" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">GPIO / I2C / ADC</text>

  <!-- 2. ESP32 -> Cloud AI -->
  <path d="M 560 200 L 610 200" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowGreen)" />
  <text x="585" y="190" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">LoRa / Wi-Fi</text>

  <!-- 3. Cloud AI -> Actuator / Relay -->
  <path d="M 880 200 L 930 200" stroke="#fbbf24" stroke-width="2.5" fill="none" marker-end="url(#arrowAmber)" />
  <text x="905" y="190" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Fan Speed %</text>

  <!-- 4. Power Lines to ESP32 & Actuator -->
  <path d="M 930 430 L 560 430 L 560 300" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowPurple)" />
  <text x="745" y="420" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="600">Regulated 5.0V DC Rail (LM2596)</text>

  <!-- Bottom Legend Banner -->
  <g transform="translate(40, 555)">
    <rect x="0" y="0" width="1120" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="26" fill="#f8fafc" font-size="12" font-weight="bold">KEY ENGINEERING ACHIEVEMENTS &amp; COURSE OBJECTIVES:</text>

    <g transform="translate(20, 42)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8" />
      <text x="18" y="10" fill="#cbd5e1" font-size="11"><tspan font-weight="bold" fill="#38bdf8">Objective 1 &amp; 2 (Multi-Sensor Edge Sensing):</tspan> Continuous thermal, IR radiation &amp; toxic gas acquisition via ESP32-S3.</text>

      <circle cx="6" cy="26" r="4" fill="#34d399" />
      <text x="18" y="30" fill="#cbd5e1" font-size="11"><tspan font-weight="bold" fill="#34d399">Objective 3 &amp; 4 (Predictive Thermal Management):</tspan> 10-minute predictive lookahead eliminates thermal inertia lag &amp; cuts power by 35%.</text>

      <circle cx="6" cy="46" r="4" fill="#fbbf24" />
      <text x="18" y="50" fill="#cbd5e1" font-size="11"><tspan font-weight="bold" fill="#fbbf24">Objective 5 &amp; 6 (Life Safety &amp; Virtual Lab):</tspan> 4-stage miner biometric reaction, SOS override, DGMS logs &amp; interactive Tinkercad wiring bench.</text>
    </g>

    <text x="1100" y="80" text-anchor="end" fill="#64748b" font-size="10">MineSafe Thermal AI • Designed &amp; Developed by Bhargav (@bhargav8-hub)</text>
  </g>
</svg>